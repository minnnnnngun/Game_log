<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameLog - 검색</title>
    <link rel="stylesheet" href="search.css">
    <link rel="stylesheet" href="../theme/theme.css">
</head>
<body>
<div class="linebox">
    <header>
        <a href="../Index/Index.html" class="logo">Game<span>Log</span></a>

        <nav aria-label="주요 메뉴">
            <ul>
                <li><a href="../Index/Index.html">홈</a></li>
                <li><a href="../genre/genre.html">장르</a></li>
                <li><a href="../search/search.html" class="active">검색</a></li>
                <li><a href="../favorites/favorites.html">즐겨찾기</a></li>
            </ul>

            <div class="nav-icons">
                <button type="button" class="theme-toggle" aria-label="화이트 모드로 변경">☾</button>
                <a href="../login/login.html" class="profile-icon" id="profile" aria-label="로그인 페이지">
                    <img src="../image/circle-user-solid-full%20(1).svg" alt="프로필" class="profile profile-default">
                    <img src="../image/circle-user-solid-full%20(2).svg" alt="" class="profile profile-hover">
                </a>
            </div>
        </nav>
    </header>

    <main>
        <section class="search-panel" aria-labelledby="searchTitle">
            <div>
                <h1 id="searchTitle">게임 검색</h1>
                <p>찾고 싶은 게임을 검색해보세요.</p>
            </div>

            <form class="search-form" id="searchForm" autocomplete="off">
                <label class="sr-only" for="searchInput">게임 제목 검색</label>
                <input id="searchInput" type="search" placeholder="게임 제목을 입력하세요">
                <button type="submit">검색</button>
            </form>
        </section>

        <section class="result-section" aria-label="검색 결과">
            <div class="result-top">
                <p>검색 결과 <span id="resultCount">12개</span></p>

                <label class="sort-box">
                    <span>정렬 :</span>
                    <select id="sortSelect">
                        <option value="relevance">관련순</option>
                        <option value="rating">평점순</option>
                        <option value="recent">최신순</option>
                        <option value="title">이름순</option>
                    </select>
                </label>
            </div>

            <div class="game-grid" id="gameGrid"></div>
            <p class="empty-message" id="emptyMessage">검색 결과가 없습니다.</p>

            <div class="pagination" id="pagination" aria-label="페이지 이동"></div>
        </section>
    </main>

    <footer>
        <div class="footer-brand">
            <a href="../Index/Index.html" class="logo">Game<span>Log</span></a>
            <p>게임을 기록하고,<br>취향을 발견하는 공간</p>
            <div class="socials" aria-label="SNS">
                <span>●</span>
                <span>▶</span>
                <span>◆</span>
            </div>
        </div>

        <div class="footer-links">
            <div>
                <h3>서비스</h3>
                <a href="../Index/Index.html">홈</a>
                <a href="../genre/genre.html">장르</a>
                <a href="../search/search.html">검색</a>
                <a href="../favorites/favorites.html">즐겨찾기</a>
            </div>
            <div>
                <h3>고객센터</h3>
                <a href="#">공지사항</a>
                <a href="#">자주 묻는 질문</a>
                <a href="#">문의하기</a>
            </div>
            <div>
                <h3>회사 정보</h3>
                <a href="#">회사 소개</a>
                <a href="#">이용 약관</a>
                <a href="#">개인정보 처리방침</a>
            </div>
        </div>

        <p class="copyright">© 2024 GameLog. All rights reserved.</p>
    </footer>
</div>

<script src="../theme/theme.js"></script>
<script src="search.js"></script>
</body>
</html>
