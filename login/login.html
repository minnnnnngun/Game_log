<!doctype html>
<!-- 로그인 화면의 뼈대를 만드는 HTML 파일입니다. -->
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameLog - 로그인</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
<div class="linebox">
    <header>
        <a href="../Index/Index.html" class="logo">Game<span>Log</span></a>

        <nav aria-label="주요 메뉴">
            <ul>
                <li><a href="../Index/Index.html">홈</a></li>
                <li><a href="../genre/genre.html">장르</a></li>
                <li><a href="../search/search.html">검색</a></li>
                <li><a href="../favorites/favorites.html">즐겨찾기</a></li>
            </ul>

            <div class="nav-icons">
                <a href="../login/login.html" class="profile-icon active-profile" id="profile" aria-label="로그인 페이지">
                    <img src="../image/circle-user-solid-full%20(1).svg" alt="프로필" class="profile profile-default">
                    <img src="../image/circle-user-solid-full%20(2).svg" alt="" class="profile profile-hover">
                </a>
            </div>
        </nav>
    </header>

    <main>
        <section class="login-panel" aria-labelledby="loginTitle">
            <div class="login-copy">
                <p class="eyebrow">Welcome Back</p>
                <h1 id="loginTitle">GameLog 로그인</h1>
                <p>저장한 게임과 최근 본 게임을 이어서 확인하세요.</p>
            </div>

            <form class="login-form" id="loginForm" autocomplete="on">
                <div class="login-status" id="loginStatus">
                    <span id="loginStatusText">로그인 상태가 아닙니다.</span>
                    <button type="button" class="logout-btn" id="logoutBtn">로그아웃</button>
                </div>

                <label>
                    이메일
                    <input type="email" id="loginEmail" placeholder="gamelog@example.com" required>
                </label>

                <label>
                    비밀번호
                    <input type="password" id="loginPassword" placeholder="비밀번호 입력" minlength="4" required>
                </label>

                <div class="form-row">
                    <label class="remember-check">
                        <input type="checkbox" id="rememberLogin">
                        로그인 유지
                    </label>

                    <a href="#">비밀번호 찾기</a>
                </div>

                <button type="submit">로그인</button>
                <p class="login-message" id="loginMessage" aria-live="polite"></p>

                <p class="auth-switch">
                    아직 계정이 없나요?
                    <a href="../signup/signup.html">회원가입</a>
                </p>
            </form>
        </section>
    </main>
</div>

<script src="login.js"></script>
</body>
</html>
